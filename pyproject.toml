[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omahitum-dataplatform_jd033"
version = "0.1.0"
description = "通过字符级与结构级特征识别数据平台工程师·混合检索的权重调节的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "omahitum" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://omahitum.github.io"
Repository = "https://github.com/omahitum/dataplatform_jd033"
Issues = "https://github.com/omahitum/dataplatform_jd033/issues"

[project.scripts]
dataplatform_jd033 = "dataplatform_jd033:main"

[tool.setuptools]
py-modules = ["dataplatform_jd033"]
